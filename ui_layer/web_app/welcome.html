<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalize | Signly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="theme_sync.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f39200',
                        'primary-hover': '#e08600',
                        'primary-alpha': 'rgba(243, 146, 0, 0.04)',
                        bg: 'var(--bg)',
                        surface: 'var(--surface)',
                        border: 'var(--border)',
                        text: 'var(--text)',
                        'text-secondary': 'var(--text-secondary)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #64748b;
        }

        .dark {
            --bg: #020617;
            --surface: #0f172a;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease;
        }

        .onboarding-viewport {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .progress-header {
            position: fixed;
            top: 3rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            text-align: center;
            z-index: 50;
        }

        .progress-rail {
            height: 4px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: #f39200;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .question-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .question-desc {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 3.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 720px;
        }

        @media (max-width: 768px) {
            .cards-container { grid-template-columns: 1fr; }
            .question-title { font-size: 2rem; }
        }

        .choice-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            text-align: left;
        }

        .choice-card:hover {
            border-color: #f39200;
            background: var(--primary-alpha);
        }

        .choice-card.selected {
            border-color: #f39200;
            background: var(--primary-alpha);
            box-shadow: 0 0 0 1px #f39200;
        }

        .multi-indicator {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: transparent;
            transition: all 0.2s ease;
        }

        .selected .multi-indicator {
            background: #f39200;
            border-color: #f39200;
            color: white;
        }

        .controls-footer {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 720px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .btn-modern {
            padding: 0.875rem 2rem;
            border-radius: 1rem;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-next {
            background: #f39200;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(243, 146, 0, 0.2);
        }

        .btn-next:hover:not(:disabled) {
            background: #e08600;
            transform: translateY(-1px);
        }

        .btn-back {
            color: var(--text-secondary);
        }

        #splash-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="antialiased">

    <div id="splash-loader">
        <div class="w-10 h-10 rounded-xl bg-[#f39200] animate-pulse"></div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="app-root" class="onboarding-viewport">

        <!-- INITIAL WELCOME -->
        <div id="welcome-screen" class="text-center space-y-8 animate__animated animate__fadeIn">
            <div class="space-y-4">
                <h1 class="text-5xl md:text-6xl font-black tracking-tight">Welcome to your workspace</h1>
                <p class="text-text-secondary text-lg font-medium max-w-md mx-auto">
                    Let's personalize your experience based on how you plan to use the platform.
                </p>
            </div>
            <button onclick="startOnboarding()" class="btn-modern btn-next px-10 py-4 text-base rounded-2xl group">
                Continue <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>

        <!-- ONBOARDING NAV -->
        <div id="onboarding-nav" class="progress-header hidden">
            <div class="progress-rail">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center px-1">
                <span id="step-label" class="text-[10px] font-bold text-text-secondary uppercase tracking-widest">Step 1 of 6</span>
                <span id="percent-label" class="text-[10px] font-bold text-[#f39200] uppercase tracking-widest">0%</span>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div id="question-wrapper" class="w-full flex flex-col items-center justify-center text-center hidden">
            <!-- Injected Content -->
        </div>

        <!-- FOOTER CONTROLS -->
        <div id="footer-controls" class="controls-footer hidden">
            <button id="btn-back" onclick="goToPrevStep()" class="btn-modern btn-back disabled:opacity-0" disabled>
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button id="btn-next" onclick="goToNextStep()" class="btn-modern btn-next disabled:opacity-30" disabled>
                Next Step <i class="fas fa-chevron-right"></i>
            </button>
        </div>

    </div>

    <script>
        const API_URL = window.location.port === '8001'
            ? window.location.origin
            : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? `http://${window.location.hostname}:8000`
                : window.location.origin;

        const token = localStorage.getItem('snlag_token');
        let onboardingData = { interests: [] };
        let currentStepIndex = 0;

        const questions = [
            {
                id: 'purpose',
                title: "What brings you here?",
                desc: "Choose the option that best describes your presence today.",
                type: 'choice',
                field: 'purpose',
                options: [
                    { id: 'explore', label: 'Explore the platform', icon: '🚀' },
                    { id: 'grow', label: 'Learn and grow', icon: '📚' },
                    { id: 'manage', label: 'Manage projects and tasks', icon: '💼' },
                    { id: 'collaborate', label: 'Connect and collaborate', icon: '🤝' },
                    { id: 'goals', label: 'Work toward specific goals', icon: '🎯' },
                    { id: 'features', label: 'Explore available features', icon: '🔎' }
                ]
            },
            {
                id: 'primary_goal',
                title: "What do you want to accomplish?",
                desc: "Help us understand your main priority.",
                type: 'choice',
                field: 'primary_goal',
                options: [
                    { id: 'organize', label: 'Organize my activities', icon: '📁' },
                    { id: 'productivity', label: 'Improve productivity', icon: '⚡' },
                    { id: 'build', label: 'Build projects', icon: '🏗️' },
                    { id: 'skills', label: 'Develop skills', icon: '🎓' },
                    { id: 'team', label: 'Collaborate with others', icon: '👥' },
                    { id: 'progress', label: 'Track progress', icon: '📊' }
                ]
            },
            {
                id: 'usage_style',
                title: "How do you prefer working?",
                desc: "Select the workflow that fits you best.",
                type: 'choice',
                field: 'usage_style',
                options: [
                    { id: 'simple', label: 'Simple and focused', icon: '✨' },
                    { id: 'detailed', label: 'Detailed management', icon: '📋' },
                    { id: 'creative', label: 'Creative workflow', icon: '🎨' },
                    { id: 'team', label: 'Team collaboration', icon: '🤝' },
                    { id: 'flexible', label: 'Flexible customization', icon: '🛠️' }
                ]
            },
            {
                id: 'experience_level',
                title: "Where are you currently?",
                desc: "Your familiarity level with tools like ours.",
                type: 'choice',
                field: 'experience_level',
                options: [
                    { id: 'beginner', label: 'Beginner', icon: '🌱' },
                    { id: 'comfortable', label: 'Comfortable user', icon: '⚙️' },
                    { id: 'experienced', label: 'Experienced user', icon: '🚀' },
                    { id: 'professional', label: 'Professional user', icon: '🏆' }
                ]
            },
            {
                id: 'interests',
                title: "What areas interest you?",
                desc: "Select all that apply to personalize your workspace.",
                type: 'multi',
                field: 'interests',
                options: [
                    { id: 'tech', label: 'Technology', icon: '💻' },
                    { id: 'learning', label: 'Learning', icon: '🧠' },
                    { id: 'business', label: 'Business', icon: '📈' },
                    { id: 'research', label: 'Research', icon: '🔬' },
                    { id: 'creativity', label: 'Creativity', icon: '🎭' },
                    { id: 'productivity', label: 'Productivity', icon: '🔋' },
                    { id: 'community', label: 'Community', icon: '🌎' },
                    { id: 'projects', label: 'Projects', icon: '📂' }
                ]
            },
            {
                id: 'workspace_preference',
                title: "How should your workspace feel?",
                desc: "The visual and operational atmosphere.",
                type: 'choice',
                field: 'workspace_preference',
                options: [
                    { id: 'clean', label: 'Clean and simple', icon: '⚪' },
                    { id: 'organized', label: 'Organized and structured', icon: '🗂️' },
                    { id: 'flexible', label: 'Flexible and customizable', icon: '🔧' },
                    { id: 'efficient', label: 'Fast and efficient', icon: '⚡' }
                ]
            }
        ];

        async function initApp() {
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const statusRes = await fetch(`${API_URL}/api/onboarding/status`, { headers: { 'Authorization': `Bearer ${token}` } });
                const status = await statusRes.json();
                if (status.completed) { window.location.href = 'workspace.html'; return; }

                onboardingData = { ...onboardingData, ...status.data };
                currentStepIndex = status.last_step || 0;

                document.getElementById('splash-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-loader').style.display = 'none', 500);
            } catch (err) { window.location.href = 'auth.html'; }
        }

        function startOnboarding() {
            gsap.to("#welcome-screen", { opacity: 0, scale: 0.95, duration: 0.4, onComplete: () => {
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('onboarding-nav').classList.remove('hidden');
                document.getElementById('question-wrapper').classList.remove('hidden');
                document.getElementById('footer-controls').classList.remove('hidden');
                renderStep();
            }});
        }

        function renderStep(direction = 'next') {
            const step = questions[currentStepIndex];
            const wrapper = document.getElementById('question-wrapper');

            let html = `
                <div class="w-full animate-stage">
                    <h2 class="question-title">${step.title}</h2>
                    <p class="question-desc">${step.desc}</p>
                    <div class="cards-container mx-auto">
            `;

            step.options.forEach(opt => {
                const isSelected = step.type === 'multi'
                    ? onboardingData[step.field]?.includes(opt.id)
                    : onboardingData[step.field] === opt.id;

                html += `
                    <div onclick="updateValue('${step.field}', '${opt.id}', ${step.type === 'multi'})"
                         class="choice-card ${isSelected ? 'selected' : ''}">
                        <div class="text-2xl">${opt.icon || '🔹'}</div>
                        <div class="flex-1">
                            <span class="font-bold text-sm tracking-tight">${opt.label}</span>
                        </div>
                        ${step.type === 'multi' ? '<div class="multi-indicator"><i class="fas fa-check"></i></div>' : ''}
                    </div>
                `;
            });

            html += `</div></div>`;

            gsap.to("#question-wrapper > div", {
                opacity: 0,
                x: direction === 'next' ? -40 : 40,
                duration: 0.3,
                onComplete: () => {
                    wrapper.innerHTML = html;
                    updateUI();
                    gsap.from(".animate-stage", { opacity: 0, x: direction === 'next' ? 40 : -40, duration: 0.5, ease: 'power4.out' });
                }
            });
        }

        function updateUI() {
            const step = questions[currentStepIndex];
            const progress = ((currentStepIndex + 1) / questions.length) * 100;

            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('step-label').innerText = `Step ${currentStepIndex + 1} of ${questions.length}`;
            document.getElementById('percent-label').innerText = `${Math.round(progress)}%`;

            document.getElementById('btn-back').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').innerText = currentStepIndex === questions.length - 1 ? 'Enter Workspace' : 'Next Step';

            const val = onboardingData[step.field];
            const isValid = step.type === 'multi' ? (Array.isArray(val) && val.length > 0) : !!val;
            document.getElementById('btn-next').disabled = !isValid;
        }

        function updateValue(field, value, isMulti = false) {
            if (isMulti) {
                if (!Array.isArray(onboardingData[field])) onboardingData[field] = [];
                const idx = onboardingData[field].indexOf(value);
                if (idx > -1) onboardingData[field].splice(idx, 1);
                else onboardingData[field].push(value);
            } else {
                onboardingData[field] = value;
            }

            saveToBackend();

            const cards = document.querySelectorAll('.choice-card');
            questions[currentStepIndex].options.forEach((opt, i) => {
                const selected = isMulti
                    ? onboardingData[field].includes(opt.id)
                    : onboardingData[field] === opt.id;
                cards[i].classList.toggle('selected', selected);
            });

            updateUI();
        }

        async function saveToBackend(final = false) {
            try {
                await fetch(`${API_URL}/api/onboarding`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...onboardingData, last_step: currentStepIndex, completed: final })
                });
            } catch (err) {}
        }

        function goToNextStep() {
            if (currentStepIndex < questions.length - 1) {
                currentStepIndex++;
                renderStep('next');
            } else {
                finishOnboarding();
            }
        }

        function goToPrevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                renderStep('prev');
            }
        }

        async function finishOnboarding() {
            const btn = document.getElementById('btn-next');
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Finalizing';
            btn.disabled = true;
            await saveToBackend(true);
            window.location.href = 'workspace.html';
        }

        initApp();
    </script>
</body>
</html>
