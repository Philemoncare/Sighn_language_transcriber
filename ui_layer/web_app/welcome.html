<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up | Signly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="theme_sync.js"></script>
    <script src="components.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        'primary-hover': 'var(--primary-hover)',
                        'primary-alpha': 'var(--primary-alpha)',
                        bg: 'var(--bg)',
                        surface: 'var(--surface)',
                        border: 'var(--border)',
                        muted: 'var(--muted)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap');

        body {
            background-color: #020617;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Sophisticated Mesh Background */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: #020617;
            background-image:
                radial-gradient(at 0% 0%, rgba(243, 146, 0, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(243, 146, 0, 0.05) 0px, transparent 50%);
        }

        .welcome-card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }

        .step-indicator {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .step-progress {
            height: 100%;
            background: var(--primary);
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .option-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option-card.selected {
            background: var(--primary-alpha);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(243, 146, 0, 0.1);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            width: 100%;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-action {
            width: 100%;
            padding: 1.25rem;
            border-radius: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(243, 146, 0, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #splash-loader {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="antialiased">

    <div id="splash-loader">
        <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center text-white shadow-2xl animate-pulse">
            <i class="fas fa-hand-holding-heart text-xl"></i>
        </div>
    </div>

    <div class="mesh-bg"></div>

    <div class="welcome-card animate__animated animate__fadeInUp">

        <!-- INITIAL SCREEN -->
        <div id="welcome-screen" class="space-y-12">
            <div class="flex flex-col items-center text-center space-y-6">
                <div class="w-16 h-16 rounded-3xl bg-primary-alpha flex items-center justify-center text-primary text-2xl border border-primary/20">
                    <i class="fas fa-sparkles"></i>
                </div>
                <div class="space-y-2">
                    <h1 class="text-4xl font-black text-white tracking-tight">Hi, <span id="user-name-display" class="text-primary italic">Friend</span></h1>
                    <p class="text-slate-400 text-sm font-medium leading-relaxed">Great to have you here. Let's briefly personalize your experience.</p>
                </div>
            </div>

            <button onclick="startOnboarding()" class="btn-action btn-primary group">
                Start Customization <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>

        <!-- ONBOARDING FLOW -->
        <div id="onboarding-flow" class="hidden space-y-10">
            <div class="space-y-4">
                <div class="step-indicator">
                    <div id="progress-fill" class="step-progress" style="width: 0%"></div>
                </div>
                <div class="space-y-1">
                    <h3 id="step-title" class="text-2xl font-black text-white tracking-tight">Configuration</h3>
                    <p id="step-subtitle" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Step 1 of 6</p>
                </div>
            </div>

            <div id="questions-container" class="min-h-[220px]">
                <!-- Dynamic Content -->
            </div>

            <div class="flex gap-4">
                <button id="btn-back" onclick="goToPrevStep()" class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-all disabled:opacity-0">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button id="btn-next" onclick="goToNextStep()" class="btn-action btn-primary flex-1 disabled:opacity-30">
                    Continue
                </button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = window.location.port === '8001'
            ? window.location.origin
            : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? `http://${window.location.hostname}:8000`
                : window.location.origin;

        const token = localStorage.getItem('snlag_token');
        let currentUser = null;
        let onboardingData = {};
        let currentStepIndex = 0;

        const questions = [
            { id: 'preferred_name', title: "Preferred Name", subtitle: "How should we address you?", type: 'text', field: 'preferred_name', placeholder: "Your name" },
            {
                id: 'purpose', title: "Primary Goal", subtitle: "What brings you to Signly?", type: 'choice', field: 'purpose',
                options: [
                    { id: 'personal', label: 'Personal', desc: 'Daily interaction', icon: 'fa-heart' },
                    { id: 'work', label: 'Professional', desc: 'Workplace collab', icon: 'fa-briefcase' },
                    { id: 'learning', label: 'Learning', desc: 'Acquiring signs', icon: 'fa-graduation-cap' }
                ]
            },
            { id: 'experience_level', title: "Proficiency", subtitle: "Your sign language level.", type: 'choice', field: 'experience_level', options: [{ id: 'beginner', label: 'Beginner', desc: 'Just starting', icon: 'fa-seedling' }, { id: 'advanced', label: 'Advanced', desc: 'Fluent user', icon: 'fa-crown' }] },
            { id: 'preferred_language', title: "Language", subtitle: "Select your main dialect.", type: 'select', field: 'preferred_language', options: ['American Sign Language (ASL)', 'British Sign Language (BSL)', 'International Sign'] },
            { id: 'accessibility_needs', title: "Interface", subtitle: "Focus the visual output.", type: 'choice', field: 'accessibility_needs', options: [{ id: 'deaf', label: 'Optimized', desc: 'Full Visual Focus', icon: 'fa-deaf' }, { id: 'hearing', label: 'Standard', desc: 'General Interaction', icon: 'fa-user' }] },
            { id: 'recognition_preference', title: "Input Node", subtitle: "How will you sign?", type: 'choice', field: 'recognition_preference', options: [{ id: 'camera', label: 'Live Camera', desc: 'Real-time sync', icon: 'fa-video' }, { id: 'upload', label: 'Video Upload', desc: 'Batch processing', icon: 'fa-file-upload' }] }
        ];

        async function initApp() {
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const userRes = await fetch(`${API_URL}/api/user/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!userRes.ok) throw new Error("Auth failed");
                currentUser = await userRes.json();
                document.getElementById('user-name-display').innerText = (currentUser.name || currentUser.username).split(' ')[0];

                const statusRes = await fetch(`${API_URL}/api/onboarding/status`, { headers: { 'Authorization': `Bearer ${token}` } });
                const status = await statusRes.json();
                if (status.completed) { window.location.href = 'workspace.html'; return; }

                onboardingData = status.data || {};
                currentStepIndex = status.last_step || 0;

                document.getElementById('splash-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-loader').style.display = 'none', 500);
            } catch (err) { window.location.href = 'auth.html'; }
        }

        function startOnboarding() {
            gsap.to("#welcome-screen", { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('onboarding-flow').classList.remove('hidden');
                gsap.from("#onboarding-flow", { opacity: 0, y: 20, duration: 0.4 });
                renderStep();
            }});
        }

        function renderStep() {
            const step = questions[currentStepIndex];
            const container = document.getElementById('questions-container');
            document.getElementById('step-title').innerText = step.title;
            document.getElementById('step-subtitle').innerText = `Step ${currentStepIndex + 1} of ${questions.length}`;
            document.getElementById('progress-fill').style.width = `${((currentStepIndex + 1) / questions.length) * 100}%`;
            document.getElementById('btn-back').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').innerText = currentStepIndex === questions.length - 1 ? 'Finish Setup' : 'Continue';
            document.getElementById('btn-next').disabled = !onboardingData[step.field];

            let html = '';
            if (step.type === 'text') {
                html = `<input type="text" class="input-glass mt-6" placeholder="${step.placeholder}" value="${onboardingData[step.field] || ''}" oninput="updateValue('${step.field}', this.value)">`;
            } else if (step.type === 'choice') {
                html = `<div class="grid grid-cols-1 gap-3 mt-6">${step.options.map(opt => `
                    <div onclick="updateValue('${step.field}', '${opt.id}')" class="option-card ${onboardingData[step.field] === opt.id ? 'selected' : ''}">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-primary"><i class="fas ${opt.icon}"></i></div>
                        <div><p class="text-sm font-bold text-white">${opt.label}</p><p class="text-[10px] text-slate-500 font-medium">${opt.desc}</p></div>
                    </div>`).join('')}</div>`;
            } else if (step.type === 'select') {
                html = `<select class="input-glass mt-6 appearance-none" onchange="updateValue('${step.field}', this.value)">
                    <option value="" disabled ${!onboardingData[step.field] ? 'selected' : ''}>Select dialect...</option>
                    ${step.options.map(opt => `<option value="${opt}" ${onboardingData[step.field] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>`;
            }
            container.innerHTML = html;
        }

        function updateValue(field, value) {
            onboardingData[field] = value;
            saveToBackend();
            renderStep();
        }

        async function saveToBackend(final = false) {
            const statusIndicator = document.getElementById('save-status');
            statusIndicator.style.opacity = '1';
            try {
                await fetch(`${API_URL}/api/onboarding`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...onboardingData, last_step: currentStepIndex, completed: final })
                });
                setTimeout(() => statusIndicator.style.opacity = '0', 1000);
            } catch (err) {}
        }

        function goToNextStep() {
            if (currentStepIndex < questions.length - 1) { currentStepIndex++; renderStep(); } else { finishOnboarding(); }
        }

        function goToPrevStep() {
            if (currentStepIndex > 0) { currentStepIndex--; renderStep(); }
        }

        async function finishOnboarding() {
            const btn = document.getElementById('btn-next');
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Finalizing';
            btn.disabled = true;
            await saveToBackend(true);
            window.location.href = 'workspace.html';
        }

        initApp();
    </script>
</body>
</html>
