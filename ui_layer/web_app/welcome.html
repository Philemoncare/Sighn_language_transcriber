<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup | Signly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="theme_sync.js"></script>
    <script src="components.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f39200',
                        'primary-hover': '#e08600',
                        'primary-alpha': 'rgba(243, 146, 0, 0.05)',
                        bg: 'var(--bg)',
                        surface: 'var(--surface)',
                        border: 'var(--border)',
                        text: 'var(--text)',
                        'text-secondary': 'var(--text-secondary)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #64748b;
        }

        .dark {
            --bg: #020617;
            --surface: #0f172a;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease;
        }

        /* Full Viewport Question Layout */
        .step-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: relative;
        }

        /* Top Progress Nav */
        .onboarding-header {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 50;
        }

        .progress-bar-rail {
            height: 4px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #f39200;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Center Question Area */
        .question-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            z-index: 10;
        }

        .question-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .question-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4rem;
        }

        /* Bottom Cards Area */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            width: 100%;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
            .question-title { font-size: 1.8rem; }
        }

        .choice-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            text-align: left;
            position: relative;
        }

        .choice-card:hover {
            border-color: #f39200;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(243, 146, 0, 0.1);
        }

        .choice-card.selected {
            border-color: #f39200;
            background: var(--primary-alpha);
            box-shadow: 0 0 0 2px #f39200;
        }

        .multi-select-indicator {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: transparent;
            transition: all 0.2s ease;
        }

        .selected .multi-select-indicator {
            background: #f39200;
            border-color: #f39200;
            color: white;
        }

        .choice-icon {
            font-size: 1.5rem;
            width: 2rem;
            text-align: center;
        }

        /* Controls Footer */
        .footer-nav {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            z-index: 50;
        }

        .btn-setup {
            padding: 1rem 2.5rem;
            border-radius: 1.25rem;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-next {
            background: #f39200;
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            background: #e08600;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(243, 146, 0, 0.2);
        }

        .btn-back {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.75rem;
        }

        .btn-back:hover:not(:disabled) {
            color: var(--text);
        }

        #splash-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="antialiased">

    <div id="splash-loader">
        <div class="flex flex-col items-center gap-6">
            <div class="w-12 h-12 rounded-2xl bg-[#f39200] flex items-center justify-center text-white shadow-2xl animate-pulse">
                <i class="fas fa-sparkles text-xl"></i>
            </div>
            <span class="text-[10px] font-bold text-text-secondary uppercase tracking-[0.3em]">Initializing Setup</span>
        </div>
    </div>

    <!-- MAIN APP ROOT -->
    <div id="app-root" class="h-full w-full relative">

        <!-- SCREEN: WELCOME -->
        <section id="welcome-screen" class="h-full w-full flex flex-col items-center justify-center text-center px-8 space-y-10">
            <div class="space-y-6">
                <div class="w-20 h-20 rounded-[2rem] bg-primary-alpha flex items-center justify-center text-[#f39200] text-4xl mx-auto border border-[#f39200]/10">
                    <i class="fas fa-mountain-sun"></i>
                </div>
                <div class="space-y-4">
                    <h1 class="text-5xl md:text-6xl font-black tracking-tight leading-none">Welcome to your workspace</h1>
                    <p class="text-text-secondary text-xl font-medium max-w-lg mx-auto leading-relaxed">
                        Let's personalize your experience based on how you plan to use the platform.
                    </p>
                </div>
            </div>

            <button onclick="startOnboarding()" class="btn-setup btn-next px-12 py-5 text-lg rounded-2xl group">
                Continue <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </section>

        <!-- SCREEN: ONBOARDING FLOW -->
        <section id="onboarding-flow" class="hidden h-full w-full">
            <div class="step-container">

                <!-- TOP: Progress Indicator -->
                <div class="onboarding-header">
                    <div class="progress-bar-rail">
                        <div id="progress-fill" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span id="step-info" class="text-[10px] font-black text-text-secondary uppercase tracking-[0.3em]">Step 1 of 6</span>
                        <span id="completion-percent" class="text-[10px] font-black text-[#f39200] uppercase tracking-[0.3em]">0%</span>
                    </div>
                </div>

                <!-- CENTER: Question -->
                <div id="question-wrapper" class="question-content">
                    <!-- Content Injected Here -->
                </div>

                <!-- BOTTOM: Footer Nav -->
                <div class="footer-nav">
                    <button id="btn-back" onclick="goToPrevStep()" class="btn-back flex items-center gap-3 disabled:opacity-0" disabled>
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <div id="save-status" class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest opacity-0 transition-opacity">
                         <i class="fas fa-check"></i> Changes Saved
                    </div>
                    <button id="btn-next" onclick="goToNextStep()" class="btn-setup btn-next disabled:opacity-30" disabled>
                        Next <i class="fas fa-chevron-right ml-2"></i>
                    </button>
                </div>

            </div>
        </section>

    </div>

    <script>
        const API_URL = window.location.port === '8001'
            ? window.location.origin
            : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? `http://${window.location.hostname}:8000`
                : window.location.origin;

        const token = localStorage.getItem('snlag_token');
        let currentUser = null;
        let onboardingData = {};
        let currentStepIndex = 0;
        let isSaving = false;

        const questions = [
            {
                id: 'purpose',
                title: "What brings you here?",
                desc: "Choose the option that best describes your presence today.",
                type: 'choice',
                field: 'purpose',
                options: [
                    { id: 'explore', label: 'Explore the platform', icon: '🚀' },
                    { id: 'grow', label: 'Learn and grow', icon: '📚' },
                    { id: 'manage', label: 'Manage projects and tasks', icon: '💼' },
                    { id: 'collaborate', label: 'Connect and collaborate', icon: '🤝' },
                    { id: 'goals', label: 'Work toward specific goals', icon: '🎯' },
                    { id: 'features', label: 'Explore available features', icon: '🔎' }
                ]
            },
            {
                id: 'primary_goal',
                title: "What do you want to accomplish?",
                desc: "Help us understand your main priority.",
                type: 'choice',
                field: 'primary_goal',
                options: [
                    { id: 'organize', label: 'Organize my activities', icon: '📅' },
                    { id: 'productivity', label: 'Improve productivity', icon: '⚡' },
                    { id: 'build', label: 'Build projects', icon: '🏗️' },
                    { id: 'skills', label: 'Develop skills', icon: '🎓' },
                    { id: 'team', label: 'Collaborate with others', icon: '👥' },
                    { id: 'progress', label: 'Track progress', icon: '📊' }
                ]
            },
            {
                id: 'usage_style',
                title: "How do you prefer working?",
                desc: "Select the workflow that fits you best.",
                type: 'choice',
                field: 'usage_style',
                options: [
                    { id: 'simple', label: 'Simple and focused', icon: '🧘' },
                    { id: 'detailed', label: 'Detailed management', icon: '📋' },
                    { id: 'creative', label: 'Creative workflow', icon: '🎨' },
                    { id: 'team', label: 'Team collaboration', icon: '🤝' },
                    { id: 'flexible', label: 'Flexible customization', icon: '🛠️' }
                ]
            },
            {
                id: 'experience_level',
                title: "Where are you currently?",
                desc: "Your familiarity level with tools like ours.",
                type: 'choice',
                field: 'experience_level',
                options: [
                    { id: 'beginner', label: 'Beginner', icon: '🌱' },
                    { id: 'comfortable', label: 'Comfortable user', icon: '⚙️' },
                    { id: 'experienced', label: 'Experienced user', icon: '🚀' },
                    { id: 'professional', label: 'Professional user', icon: '🏆' }
                ]
            },
            {
                id: 'interests',
                title: "What areas interest you?",
                desc: "Select all that apply to personalize your stream.",
                type: 'multi',
                field: 'interests',
                options: [
                    { id: 'tech', label: 'Technology', icon: '💻' },
                    { id: 'learning', label: 'Learning', icon: '🧠' },
                    { id: 'business', label: 'Business', icon: '📈' },
                    { id: 'research', label: 'Research', icon: '🔬' },
                    { id: 'creativity', label: 'Creativity', icon: '🎭' },
                    { id: 'productivity', label: 'Productivity', icon: '🔋' },
                    { id: 'community', label: 'Community', icon: '🌎' },
                    { id: 'projects', label: 'Projects', icon: '📂' }
                ]
            },
            {
                id: 'workspace_preference',
                title: "How should your workspace feel?",
                desc: "The visual and operational atmosphere.",
                type: 'choice',
                field: 'workspace_preference',
                options: [
                    { id: 'clean', label: 'Clean and simple', icon: '✨' },
                    { id: 'organized', label: 'Organized and structured', icon: '📁' },
                    { id: 'flexible', label: 'Flexible and customizable', icon: '🔧' },
                    { id: 'efficient', label: 'Fast and efficient', icon: '⚡' }
                ]
            }
        ];

        async function initApp() {
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const userRes = await fetch(`${API_URL}/api/user/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!userRes.ok) throw new Error("Auth failed");
                currentUser = await userRes.json();

                const statusRes = await fetch(`${API_URL}/api/onboarding/status`, { headers: { 'Authorization': `Bearer ${token}` } });
                const status = await statusRes.json();
                if (status.completed) { window.location.href = 'workspace.html'; return; }

                onboardingData = status.data || {};
                if (!Array.isArray(onboardingData.interests)) onboardingData.interests = [];
                currentStepIndex = status.last_step || 0;

                document.getElementById('splash-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-loader').style.display = 'none', 500);
            } catch (err) { window.location.href = 'auth.html'; }
        }

        function startOnboarding() {
            gsap.to("#welcome-screen", { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('onboarding-flow').classList.remove('hidden');
                gsap.from("#onboarding-flow", { opacity: 0, y: 20, duration: 0.6 });
                renderStep();
            }});
        }

        function renderStep(direction = 'next') {
            const step = questions[currentStepIndex];
            const wrapper = document.getElementById('question-wrapper');

            let html = `
                <div class="w-full animate-stage">
                    <h2 class="question-title">${step.title}</h2>
                    <p class="question-desc">${step.desc}</p>

                    <div class="cards-grid">
            `;

            step.options.forEach(opt => {
                const isSelected = step.type === 'multi'
                    ? onboardingData[step.field]?.includes(opt.id)
                    : onboardingData[step.field] === opt.id;

                html += `
                    <div onclick="updateValue('${step.field}', '${opt.id}', ${step.type === 'multi'})"
                         class="choice-card ${isSelected ? 'selected' : ''}">
                        <div class="choice-icon">${opt.icon || '🔹'}</div>
                        <div class="flex-1">
                            <span class="font-bold text-sm tracking-tight">${opt.label}</span>
                        </div>
                        ${step.type === 'multi' ? '<div class="multi-select-indicator"><i class="fas fa-check"></i></div>' : ''}
                    </div>
                `;
            });

            html += `</div></div>`;

            // Page Transition
            gsap.to("#question-wrapper > div", {
                opacity: 0,
                x: direction === 'next' ? -50 : 50,
                duration: 0.3,
                onComplete: () => {
                    wrapper.innerHTML = html;
                    updateUI();
                    gsap.from(".animate-stage", { opacity: 0, x: direction === 'next' ? 50 : -50, duration: 0.5, ease: 'power4.out' });
                }
            });
        }

        function updateUI() {
            const step = questions[currentStepIndex];
            const progress = ((currentStepIndex + 1) / questions.length) * 100;

            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('step-info').innerText = `Step ${currentStepIndex + 1} of ${questions.length}`;
            document.getElementById('completion-percent').innerText = `${Math.round(progress)}%`;

            document.getElementById('btn-back').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').innerText = currentStepIndex === questions.length - 1 ? 'Execute Link' : 'Next Step';

            const val = onboardingData[step.field];
            const isValid = step.type === 'multi' ? (Array.isArray(val) && val.length > 0) : !!val;
            document.getElementById('btn-next').disabled = !isValid;
        }

        function updateValue(field, value, isMulti = false) {
            if (isMulti) {
                if (!Array.isArray(onboardingData[field])) onboardingData[field] = [];
                const idx = onboardingData[field].indexOf(value);
                if (idx > -1) onboardingData[field].splice(idx, 1);
                else onboardingData[field].push(value);
            } else {
                onboardingData[field] = value;
            }

            saveToBackend();

            // Immediate UI update
            const cards = document.querySelectorAll('.choice-card');
            questions[currentStepIndex].options.forEach((opt, i) => {
                const selected = isMulti
                    ? onboardingData[field].includes(opt.id)
                    : onboardingData[field] === opt.id;
                cards[i].classList.toggle('selected', selected);
            });

            updateUI();
        }

        async function saveToBackend(final = false) {
            const statusIndicator = document.getElementById('save-status');
            statusIndicator.style.opacity = '1';
            try {
                await fetch(`${API_URL}/api/onboarding`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...onboardingData, last_step: currentStepIndex, completed: final })
                });
                setTimeout(() => statusIndicator.style.opacity = '0', 1500);
            } catch (err) {}
        }

        function goToNextStep() {
            if (currentStepIndex < questions.length - 1) {
                currentStepIndex++;
                renderStep('next');
            } else {
                finishOnboarding();
            }
        }

        function goToPrevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                renderStep('prev');
            }
        }

        async function finishOnboarding() {
            const wrapper = document.getElementById('question-wrapper');
            const nav = document.querySelector('.onboarding-header');
            const footer = document.querySelector('.footer-nav');

            gsap.to([wrapper, nav, footer], { opacity: 0, y: -20, duration: 0.5, stagger: 0.1, onComplete: async () => {
                await saveToBackend(true);

                // Show Final Screen
                wrapper.innerHTML = `
                    <div class="text-center space-y-12 animate__animated animate__zoomIn">
                        <div class="space-y-6">
                            <div class="text-7xl">🎯</div>
                            <h2 class="text-5xl font-black tracking-tight">Your workspace is ready</h2>
                            <div class="p-10 bg-primary-alpha rounded-[2.5rem] border border-primary/10 max-w-sm mx-auto space-y-5">
                                <div class="flex justify-between text-[10px] font-black uppercase tracking-[0.2em]">
                                    <span class="text-text-secondary">Purpose</span>
                                    <span class="text-[#f39200]">${onboardingData.purpose}</span>
                                </div>
                                <div class="flex justify-between text-[10px] font-black uppercase tracking-[0.2em]">
                                    <span class="text-text-secondary">Focus</span>
                                    <span class="text-[#f39200]">${onboardingData.primary_goal}</span>
                                </div>
                                <div class="flex justify-between text-[10px] font-black uppercase tracking-[0.2em]">
                                    <span class="text-text-secondary">Experience</span>
                                    <span class="text-[#f39200]">${onboardingData.experience_level}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="window.location.href='workspace.html'" class="btn-setup btn-next mx-auto px-16 py-6 text-xl rounded-3xl">
                            Enter Workspace
                        </button>
                    </div>
                `;
                gsap.to(wrapper, { opacity: 1, y: 0, duration: 0.5 });
            }});
        }

        initApp();
    </script>
</body>
</html>
